<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pautas · Guardia HNRG</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"><style>
/* Ficha de bolsillo: una columna angosta, la alarma en rojo arriba de todo, lo demás tranquilo */
:root{
  --bg:#F4F7F8; --card:#FFFFFF; --ink:#13303A; --muted:#536A73; --line:#D9E3E6;
  --alarm:#B42318; --alarm-bg:#FDEDEB; --alarm-ink:#7A1A12;
  --azul:#1F5FA6; --ambar:#9A5B00; --verde:#2A7148; --rosa:#B5176E; --teja:#BF4B2E; --marron:#8A5A2B;
  --f-display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A1F; --card:#15252B; --ink:#E6EFF1; --muted:#9CB2B9; --line:#26393F;
  --alarm:#FF8A7A; --alarm-bg:#3A1714; --alarm-ink:#FFD6CF;
  --azul:#7DB3F0; --ambar:#F2B657; --verde:#7FCB9C; --rosa:#F48FB1; --teja:#F2956E; --marron:#D1A26A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --card:#15252B; --ink:#E6EFF1; --muted:#9CB2B9; --line:#26393F;
  --alarm:#FF8A7A; --alarm-bg:#3A1714; --alarm-ink:#FFD6CF;
  --azul:#7DB3F0; --ambar:#F2B657; --verde:#7FCB9C; --rosa:#F48FB1; --teja:#F2956E; --marron:#D1A26A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
.wrap{max-width:34rem;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
.hosp{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
header{display:flex;flex-direction:column;gap:4px;padding-bottom:16px;border-bottom:3px solid var(--tema)}
h1{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:1.05rem}
h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0 0 8px;text-wrap:balance}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
li{display:grid;grid-template-columns:1.4rem 1fr;gap:8px;align-items:start}
li>span{min-width:0}
.mk{font-weight:700;line-height:1.5;text-align:center}
.intro p{margin:0 0 6px}
.alarma{background:var(--alarm-bg);border:2px solid var(--alarm);border-radius:14px;padding:16px}
.alarma h2{color:var(--alarm)}
.alarma li{color:var(--alarm-ink)}
.alarma .mk{color:var(--alarm)}
.alarma .pie{margin:12px 0 0;font-weight:700;color:var(--alarm)}
.cuidados .mk{color:var(--tema)} .intro .mk{color:var(--tema)}
.bloque{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.bloque h3{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0;color:var(--tema)}
.bloque p{margin:0}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-variant-numeric:tabular-nums}
caption{text-align:left;font-weight:700;padding-bottom:6px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--muted);background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
ol{margin:0;padding:0;list-style:none;counter-reset:paso;display:flex;flex-direction:column;gap:10px}
ol li{counter-increment:paso}
ol li::before{content:counter(paso);font-weight:700;color:var(--card);background:var(--tema);border-radius:50%;width:1.4rem;height:1.4rem;display:grid;place-items:center;font-size:.85rem;margin-top:.1rem}
.evitar .mk{color:var(--muted)}
footer{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
footer strong{color:var(--ink)}
.t-azul{--tema:var(--azul)} .t-ambar{--tema:var(--ambar)} .t-verde{--tema:var(--verde)} .t-rosa{--tema:var(--rosa)} .t-teja{--tema:var(--teja)} .t-marron{--tema:var(--marron)}
.chip{align-self:flex-start;font-size:.8rem;font-weight:700;color:var(--tema);border:1.5px solid var(--tema);border-radius:999px;padding:1px 10px}
nav.temas{display:flex;flex-wrap:wrap;gap:8px}
nav.temas a{font-weight:700;color:var(--tema);text-decoration:none;border:1.5px solid var(--tema);border-radius:999px;padding:6px 14px}
nav.temas a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.borrador{background:var(--card);border:1px dashed var(--muted);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.sep{height:28px}
/* Recuadro de aviso (amarillo pastel), al estilo del de alarma pero secundario */
.aviso{background:#FEF6DA;border:2px solid #E3B341;border-radius:14px;padding:16px}
.aviso h3{color:#8A5A00}
.aviso .mk{color:#C98A00}
.aviso li,.aviso p{color:#5A4300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .aviso{background:#2C2511;border-color:#B98B24}
:root:not([data-theme="light"]) .aviso h3{color:#F2C14E}
:root:not([data-theme="light"]) .aviso .mk{color:#F2C14E}
:root:not([data-theme="light"]) .aviso li,:root:not([data-theme="light"]) .aviso p{color:#F0E2BC}}
:root[data-theme="dark"] .aviso{background:#2C2511;border-color:#B98B24}
:root[data-theme="dark"] .aviso h3{color:#F2C14E}
:root[data-theme="dark"] .aviso .mk{color:#F2C14E}
:root[data-theme="dark"] .aviso li,:root[data-theme="dark"] .aviso p{color:#F0E2BC}
/* Desplegables (details/summary): por ejemplo, dosis por fármaco */
details.desp{border:1px solid var(--line);border-radius:10px;background:var(--card)}
details.desp summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.desp summary::-webkit-details-marker{display:none}
details.desp summary::after{content:"+";font-family:var(--f-display);font-size:1.4rem;line-height:1;color:var(--tema);font-weight:700}
details.desp[open] summary::after{content:"–"}
summary .droga{font-weight:700;color:var(--tema)}
summary .pres{color:var(--ink);font-weight:400;font-size:.95rem}
.desp-cont{padding:0 14px 14px}
.nota{margin:10px 0 0;font-size:.9rem;color:var(--muted);font-style:italic}
.btn-descarga{display:inline-block;margin-top:4px;background:var(--tema);color:var(--card);text-decoration:none;font-family:var(--f-display);font-weight:600;padding:11px 18px;border-radius:999px}
.btn-descarga:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style></head>
